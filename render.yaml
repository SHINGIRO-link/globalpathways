databases:
  - name: globalpathways-db
    databaseName: globalpathways
    user: globalpathways
    plan: basic-256mb

services:
  - type: web
    name: globalpathways
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: globalpathways-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: OPPORTUNITY_FEED_URLS
        sync: false

  - type: cron
    name: globalpathways-opportunity-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 */6 * * *"
    dockerCommand: "python manage.py migrate --noinput && python manage.py sync_opportunities"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: globalpathways-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: OPPORTUNITY_FEED_URLS
        sync: false
